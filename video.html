<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein iPhone wartet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ff1493;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2rem;
    }

    #video-wrap {
      width: min(860px, 100%);
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255,255,255,0.35), 0 0 120px rgba(255,20,147,0.5);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    #playOverlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      cursor: pointer;
    }

    #playOverlay.visible { display: flex; }

    .play-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ff1493;
      box-shadow: 0 0 40px rgba(255,255,255,0.5);
    }

    .btn {
      display: none;
      padding: 1.2rem 2.5rem;
      border: none;
      border-radius: 999px;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #ff1493;
      box-shadow: 0 6px 30px rgba(255,255,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(255,255,255,0.6); }
    .btn:active { transform: translateY(0); }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="video-wrap" style="position:relative;">
    <video id="vid" playsinline autoplay>
      <source src="video.mp4" type="video/mp4">
      <source src="video.mov" type="video/quicktime">
    </video>
    <div id="playOverlay">
      <div class="play-circle">&#9654;</div>
    </div>
  </div>

  <button class="btn" id="cta" onclick="window.location.href='invitation.html'">JETZT DEINEN PLATZ SICHERN</button>

  <script>
    const vid     = document.getElementById('vid');
    const cta     = document.getElementById('cta');
    const overlay = document.getElementById('playOverlay');

    vid.play().catch(() => {
      overlay.classList.add('visible');
    });

    overlay.addEventListener('click', () => {
      vid.play();
      overlay.classList.remove('visible');
    });

    vid.addEventListener('ended', () => {
      cta.style.display = 'inline-block';
    });
  </script>
</body>
</html>
