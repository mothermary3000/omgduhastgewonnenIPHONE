<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danke!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(150deg, #fff9e6 0%, #fde8d0 35%, #e8f6f0 70%, #fdf0fb 100%);
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.88);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 30px rgba(180,180,180,0.2), 0 0 0 1.5px rgba(200,200,200,0.5);
    }
    h1 {
      font-size: 2rem;
      color: #c0824a;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.05rem;
      color: #666;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Danke!</h1>
    <p>Wir haben deine Antwort bekommen und freuen uns auf dich.</p>
  </div>
</body>
</html>
