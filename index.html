<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geburtstags-Einladung</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFD93D 0%, #FF6B9D 40%, #845EC2 100%);
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      opacity: 0.35;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.35; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.96);
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .emoji-banner { font-size: 3rem; margin-bottom: 0.5rem; }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.2rem;
      background: linear-gradient(90deg, #FF6B9D, #845EC2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: #888;
      font-size: 1rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    /* --- Upload zone --- */
    .upload-zone {
      border: 3px dashed #FFD93D;
      border-radius: 1.2rem;
      padding: 2rem 1rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #FFFBEE;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #FF6B9D;
      background: #FFF0F6;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .upload-label {
      display: block;
      font-weight: 700;
      color: #555;
      font-size: 0.95rem;
    }

    .upload-hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 0.3rem;
    }

    /* --- Preview --- */
    #preview-wrap {
      display: none;
      margin-bottom: 1.5rem;
    }

    #preview-wrap img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #FF6B9D;
      box-shadow: 0 6px 20px rgba(255,107,157,0.35);
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .preview-label {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #888;
    }

    /* --- Button --- */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem 2rem;
      border: none;
      border-radius: 999px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      background: linear-gradient(135deg, #FF6B9D, #845EC2);
      color: #fff;
      box-shadow: 0 6px 20px rgba(132,94,194,0.4);
      letter-spacing: 0.02em;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(132,94,194,0.5); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .skip-link {
      display: block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }
    .skip-link:hover { color: #845EC2; }
  </style>
</head>
<body>

  <div class="confetti-wrap" id="confetti"></div>

  <div class="card">
    <div class="emoji-banner">🎂🎉🎈</div>
    <h1>DU HAST GEWONNEN!!! JETZT EIN NEUES IPHONE</h1>
    <p class="subtitle">Lade dein Lieblingsfoto hoch und starte!</p>

    <div class="upload-zone" id="zone">
      <input type="file" id="fileInput" accept="image/*">
      <div class="upload-icon">📸</div>
      <span class="upload-label">Foto auswählen oder hierher ziehen</span>
      <span class="upload-hint">JPG, PNG, GIF – max. 10 MB</span>
    </div>

    <div id="preview-wrap">
      <img id="preview" src="" alt="Vorschau">
      <p class="preview-label">Sieht super aus! ✨</p>
    </div>

    <button class="btn" id="goBtn" onclick="go()">Zur Einladung →</button>
    <a class="skip-link" onclick="skipPhoto()">Ohne Foto fortfahren</a>
  </div>

  <script>
    // --- Floating dots background ---
    (function() {
      const colors = ['#FF6B9D','#FFD93D','#4ECDC4','#845EC2','#FF9671'];
      const wrap = document.getElementById('confetti');
      for (let i = 0; i < 30; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        const size = 10 + Math.random() * 30;
        d.style.cssText = `
          width:${size}px; height:${size}px;
          left:${Math.random()*100}%;
          background:${colors[i % colors.length]};
          animation-duration:${6 + Math.random()*10}s;
          animation-delay:${Math.random()*8}s;
        `;
        wrap.appendChild(d);
      }
    })();

    // --- Upload handling ---
    const zone      = document.getElementById('zone');
    const fileInput = document.getElementById('fileInput');
    const preview   = document.getElementById('preview');
    const prevWrap  = document.getElementById('preview-wrap');

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', ()  => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      if (file.size > 10 * 1024 * 1024) { alert('Datei zu groß (max. 10 MB)'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const b64 = e.target.result;
        try { localStorage.setItem('bdayPhoto', b64); } catch(_) {}
        preview.src = b64;
        prevWrap.style.display = 'block';
        zone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function go() {
      window.location.href = 'video.html';
    }

    function skipPhoto() {
      localStorage.removeItem('bdayPhoto');
      window.location.href = 'video.html';
    }
  </script>
</body>
</html>
