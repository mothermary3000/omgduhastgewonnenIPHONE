<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DU HAST GEWONNEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #080400;
      font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Comic Sans', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    .fire-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .flame {
      position: absolute;
      bottom: -10px;
      border-radius: 50% 50% 30% 30%;
      transform-origin: bottom center;
      animation: burn linear infinite;
    }

    @keyframes burn {
      0%   { transform: translateY(0) scaleX(1); opacity: 0.9; }
      60%  { transform: translateY(-65vh) scaleX(0.6); opacity: 0.5; }
      100% { transform: translateY(-115vh) scaleX(0.2); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(5, 2, 0, 0.82);
      border: 3px solid #ff4500;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(255,69,0,0.55), 0 0 120px rgba(255,69,0,0.2);
      animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    h1 {
      font-size: 1.7rem;
      color: #FFD700;
      text-shadow: 2px 2px 0 #ff4500, 0 0 24px #ff6600;
      margin-bottom: 1.5rem;
      line-height: 1.35;
    }

    .photo-wrap {
      width: 100%;
      height: clamp(180px, 50vw, 280px);
      border-radius: 1rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 3px solid #ff4500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,69,0,0.08);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder-label {
      color: #ff6600;
      font-size: 0.95rem;
    }

    .btn {
      width: 100%;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 999px;
      font-family: 'Comic Neue', 'Comic Sans MS', 'Comic Sans', cursive;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2200, #ff8c00);
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
      box-shadow: 0 6px 24px rgba(255,69,0,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255,69,0,0.7); }
    .btn:active { transform: translateY(0); }

    .nudge {
      display: none;
      text-align: center;
      margin-bottom: 0.6rem;
      animation: fadeIn 0.5s ease both;
    }

    .nudge.show { display: block; }

    .nudge-text {
      color: #FFD700;
      font-size: 0.95rem;
      font-weight: bold;
      text-shadow: 1px 1px 0 #ff4500;
      margin-bottom: 0.3rem;
    }

    .nudge-arrows {
      font-size: 1.6rem;
      color: #ff8c00;
      animation: bounce 0.6s ease infinite alternate;
      display: inline-block;
    }

    @keyframes bounce {
      from { transform: translateY(-4px); }
      to   { transform: translateY(4px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="fire-wrap" id="fireWrap"></div>

  <div class="card">
    <h1>OMG DU WURDEST AUßERWÄHLT!!! DU HAST DAS NEUE IPHONE GEWONNEN!!!</h1>

    <div class="photo-wrap" id="photoWrap">
      <img src="iphone.png" alt="Foto" onerror="this.style.display='none'; document.getElementById('photoLabel').style.display='block'">
      <span class="photo-placeholder-label" id="photoLabel" style="display:none">[ Foto folgt ]</span>
    </div>

    <div class="nudge" id="nudge">
      <div class="nudge-text">Das ist kein Scam, klicke jetzt!</div>
      <div class="nudge-arrows">&#8595; &#8595;</div>
    </div>
    <button class="btn" id="mainBtn" onclick="window.location.href='video.html'">get your iPhone HERE</button>
  </div>

  <script>
    (function() {
      const wrap = document.getElementById('fireWrap');
      const gradients = [
        ['#cc0000','#ff4500'],
        ['#ff2200','#ff6600'],
        ['#ff4500','#ff8c00'],
        ['#ff6600','#ffaa00'],
        ['#ff8c00','#ffd000'],
      ];
      for (let i = 0; i < 50; i++) {
        const f = document.createElement('div');
        f.className = 'flame';
        const w = 18 + Math.random() * 55;
        const h = w * (1.4 + Math.random() * 1.2);
        const g = gradients[Math.floor(Math.random() * gradients.length)];
        f.style.cssText = `
          width:${w}px;
          height:${h}px;
          left:${Math.random() * 102}%;
          background: linear-gradient(to top, ${g[0]}, ${g[1]}, transparent);
          filter: blur(${1.5 + Math.random() * 4}px);
          animation-duration:${1.8 + Math.random() * 2.5}s;
          animation-delay:${Math.random() * 3}s;
        `;
        wrap.appendChild(f);
      }
    })();

    const nudge = document.getElementById('nudge');
    const timer = setTimeout(() => nudge.classList.add('show'), 3000);
    document.getElementById('mainBtn').addEventListener('click', () => clearTimeout(timer));
  </script>
</body>
</html>
