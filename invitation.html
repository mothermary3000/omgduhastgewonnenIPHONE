<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wir hatten Geburtstag</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(150deg, #fff9e6 0%, #fde8d0 35%, #e8f6f0 70%, #fdf0fb 100%);
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      color: #333;
      overflow-x: hidden;
    }

    /* ---- Sparkle particles ---- */
    .sparkle-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle linear infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0.5) rotate(0deg); }
      30%  { opacity: 1; }
      60%  { opacity: 0.6; }
      100% { opacity: 0; transform: scale(1.5) rotate(180deg) translateY(-40px); }
    }

    /* ---- Page layout ---- */
    .page {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Header ---- */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      background: linear-gradient(90deg,
        #a0a0a0 0%,
        #e8e8e8 20%,
        #ffffff 35%,
        #c8c8c8 50%,
        #ffffff 65%,
        #e0e0e0 80%,
        #a0a0a0 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: silverShimmer 3.5s linear infinite;
      line-height: 1.2;
      filter: drop-shadow(0 2px 8px rgba(180,180,180,0.5));
    }

    @keyframes silverShimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .subtitle {
      font-size: 1.25rem;
      color: #a07a5a;
      margin-top: 0.8rem;
      font-style: italic;
    }

    /* ---- Details card ---- */
    .card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 1.5rem;
      padding: 2rem 2rem;
      box-shadow:
        0 4px 30px rgba(180,180,180,0.2),
        0 0 0 1.5px rgba(200,200,200,0.5),
        inset 0 0 0 1px rgba(255,255,255,0.9);
      margin-bottom: 1.5rem;
      backdrop-filter: blur(8px);
    }

    .card-title {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 1.4rem;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid #f0ece4;
    }
    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }

    .detail-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      width: 2rem;
      text-align: center;
      margin-top: 0.15rem;
    }

    .detail-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #bbb;
      margin-bottom: 0.2rem;
    }

    .detail-value {
      font-size: 1.05rem;
      color: #444;
      line-height: 1.5;
    }

    .detail-value strong {
      color: #c0824a;
    }

    .detail-note {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.2rem;
    }

    /* ---- Silver shimmer divider ---- */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4d4d4, #ffffff, #d4d4d4, transparent);
      border-radius: 1px;
      margin: 2rem 0;
      animation: silverShimmer 3.5s linear infinite;
      background-size: 200% auto;
    }

    /* ---- Footer ---- */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #ccc;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <div class="sparkle-wrap" id="sparkleWrap"></div>

  <div class="page">

    <div class="header">
      <h1>Wir hatten Geburtstag</h1>
      <p class="subtitle">und wollen das mit dir feiern.</p>
    </div>

    <div class="divider"></div>

    <div class="card">
      <div class="card-title">Details</div>

      <div class="detail-row">
        <div class="detail-icon">&#128197;</div>
        <div>
          <div class="detail-label">Wann</div>
          <div class="detail-value"><strong>18.&ndash;20. September</strong></div>
          <div class="detail-note">Fest am 19.09. &mdash; Anreise Freitag ab x Uhr möglich</div>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">&#128205;</div>
        <div>
          <div class="detail-label">Wo</div>
          <div class="detail-value"><strong>Pfarrhaus Kirchkogel</strong></div>
          <div class="detail-note">Adresse folgt</div>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">&#128248;</div>
        <div>
          <div class="detail-label">Dresscode</div>
          <div class="detail-value">folgt</div>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <footer>
      Wir freuen uns auf dich.
    </footer>

  </div>

  <script>
    (function() {
      const wrap = document.getElementById('sparkleWrap');
      const colors = ['#ffffff','#e8e8e8','#ffd700','#ffe4a0','#c8ecd4','#ffc8e0'];
      for (let i = 0; i < 45; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const size = 4 + Math.random() * 10;
        s.style.cssText = `
          width:${size}px;
          height:${size}px;
          left:${Math.random() * 100}%;
          top:${Math.random() * 100}%;
          background:${colors[Math.floor(Math.random() * colors.length)]};
          animation-duration:${2 + Math.random() * 4}s;
          animation-delay:${Math.random() * 5}s;
        `;
        wrap.appendChild(s);
      }
    })();
  </script>
</body>
</html>
